<ActionBar class="action-bar">
  <NavigationButton visibility="hidden"></NavigationButton>

  <GridLayout columns="50, *">
    <Label class="fas" text="&#xf0c9;" (tap)="onDrawerButtonTap()"></Label>
    <Label class="action-bar-title" text="Buscar tareas" col="1"></Label>
  </GridLayout>
</ActionBar>

<GridLayout rows="auto, *" class="page-content">
  <StackLayout row="0" class="search-container">
    <TextField
  hint="Buscar por tarea o asignatura..."
  [(ngModel)]="searchText"
  #searchInput="ngModel"
  minSearchLength
  class="search-input"
></TextField>

<Label
  *ngIf="searchInput.invalid && searchInput.touched"
  text="Escribe al menos 3 caracteres para buscar."
  class="empty-message"
></Label>
  </StackLayout>

  <ListView
    row="1"
    [items]="filteredTasks"
    separatorColor="transparent"
    class="tasks-list"
  >
    <ng-template let-task="item">
      <FlexboxLayout flexDirection="column" class="task-list-item">
        <StackLayout class="task-card">
          <Label
            [text]="task.title"
            class="task-title"
            textWrap="true"
          ></Label>

          <Label
            [text]="task.subject + ' • ' + task.dueDate"
            class="task-details"
            textWrap="true"
          ></Label>

          <Label
            [text]="task.completed ? 'Completada' : 'Pendiente'"
            class="task-details"
          ></Label>
        </StackLayout>
      </FlexboxLayout>
    </ng-template>
  </ListView>

  <Label
    row="1"
    *ngIf="filteredTasks.length === 0"
    text="No se encontraron tareas."
    class="empty-message"
  ></Label>
</GridLayout>
