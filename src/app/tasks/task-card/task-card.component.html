
<StackLayout class="task-card">
  <GridLayout columns="*, auto" rows="auto, auto, auto">
    <Label
      row="0"
      col="0"
      [text]="task.title"
      class="task-title"
      textWrap="true"
      (longPress)="onTitleLongPress()"
    ></Label>

    <Label
      row="1"
      col="0"
      [text]="task.subject + ' • ' + task.dueDate"
      class="task-details"
      textWrap="true"
    ></Label>

    <Button
      #statusButton
      row="0"
      rowSpan="2"
      col="1"
      [text]="task.completed ? 'Completada' : 'Pendiente'"
      [class.completed]="task.completed"
      class="task-button"
      (tap)="onToggle()"
    ></Button>

    <Button
      row="2"
      col="0"
      text="Ver detalle"
      class="task-button"
      (tap)="onOpenDetail()"
    ></Button>

    <Button
      row="2"
      col="1"
      text="Categoría"
      class="task-button"
      (tap)="onChangeCategory()"
    ></Button>

    <Button
      row="2"
      col="1"
      text="Categoría"
      class="task-button"
      (tap)="onChangeCategory()"
    ></Button>
  </GridLayout>
</StackLayout>
